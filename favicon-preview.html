<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { background: #f0f0f0; font-family: Arial, sans-serif; padding: 40px; }
.row { display: flex; align-items: flex-end; gap: 32px; margin-bottom: 40px; }
.item { text-align: center; }
.item p { margin-top: 8px; font-size: 12px; color: #666; }
.bad { border: 2px dashed red; display: inline-block; }
.good { border: 2px dashed green; display: inline-block; }

/* Simulation onglet navigateur */
.tab { display: flex; align-items: center; gap: 6px; background: #e8e8e8; border-radius: 8px 8px 0 0; padding: 8px 16px; width: 200px; font-size: 13px; border: 1px solid #ccc; }
.tab img { flex-shrink: 0; }
</style>
</head>
<body>

<h2 style="margin-bottom:24px;">Comparaison favicon Cohesif Auto</h2>

<h3 style="color:red; margin-bottom:12px;">❌ Logo complet (trop large — rendu actuel)</h3>
<div class="row">
  <div class="item">
    <div class="bad"><img src="./logo-cohesif-auto.png" width="16" height="16" style="display:block;"></div>
    <p>16×16px</p>
  </div>
  <div class="item">
    <div class="bad"><img src="./logo-cohesif-auto.png" width="32" height="32" style="display:block;"></div>
    <p>32×32px</p>
  </div>
  <div class="item">
    <div class="bad"><img src="./logo-cohesif-auto.png" width="48" height="48" style="display:block;"></div>
    <p>48×48px</p>
  </div>
</div>

<div style="margin-bottom:32px;">
  <p style="margin-bottom:8px; font-size:13px; color:#666;">Simulation onglet navigateur :</p>
  <div class="tab">
    <img src="./logo-cohesif-auto.png" width="16" height="16">
    <span>Cohesif Auto — Mobili…</span>
  </div>
</div>

<h3 style="color:green; margin-bottom:12px;">✅ Icône seule (recommandé)</h3>
<div class="row">
  <div class="item">
    <div class="good">
      <svg width="16" height="16" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="7" fill="#0f1720"/>
        <circle cx="16" cy="16" r="10" fill="none" stroke="#4a7ec7" stroke-width="2.5"/>
        <path d="M8 22 L16 8 L24 22 L16 19 Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="16" cy="18" r="2.5" fill="#4a7ec7"/>
      </svg>
    </div>
    <p>16×16px</p>
  </div>
  <div class="item">
    <div class="good">
      <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="7" fill="#0f1720"/>
        <circle cx="16" cy="16" r="10" fill="none" stroke="#4a7ec7" stroke-width="2.5"/>
        <path d="M8 22 L16 8 L24 22 L16 19 Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="16" cy="18" r="2.5" fill="#4a7ec7"/>
      </svg>
    </div>
    <p>32×32px</p>
  </div>
  <div class="item">
    <div class="good">
      <svg width="48" height="48" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="7" fill="#0f1720"/>
        <circle cx="16" cy="16" r="10" fill="none" stroke="#4a7ec7" stroke-width="2.5"/>
        <path d="M8 22 L16 8 L24 22 L16 19 Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="16" cy="18" r="2.5" fill="#4a7ec7"/>
      </svg>
    </div>
    <p>48×48px</p>
  </div>
</div>

<div>
  <p style="margin-bottom:8px; font-size:13px; color:#666;">Simulation onglet navigateur :</p>
  <div class="tab">
    <svg width="16" height="16" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="7" fill="#0f1720"/>
      <circle cx="16" cy="16" r="10" fill="none" stroke="#4a7ec7" stroke-width="2.5"/>
      <path d="M8 22 L16 8 L24 22 L16 19 Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="16" cy="18" r="2.5" fill="#4a7ec7"/>
    </svg>
    <span>Cohesif Auto — Mobili…</span>
  </div>
</div>

</body>
</html>

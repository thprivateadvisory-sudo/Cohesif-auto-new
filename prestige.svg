<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1a1612"/>
<stop offset="100%" stop-color="#0a0806"/>
</linearGradient>
<linearGradient id="sport" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#3a5a85"/>
<stop offset="40%" stop-color="#1e3a5f"/>
<stop offset="100%" stop-color="#0a1525"/>
</linearGradient>
<linearGradient id="reflect" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#fff" stop-opacity="0"/>
<stop offset="50%" stop-color="#a8c8e8" stop-opacity="0.6"/>
<stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="600" height="400" fill="url(#bgp)"/>
<!-- Particles -->
<circle cx="80" cy="60" r="1" fill="#4d7ab0" opacity="0.6"/>
<circle cx="500" cy="80" r="1" fill="#4d7ab0" opacity="0.4"/>
<circle cx="120" cy="320" r="1" fill="#4d7ab0" opacity="0.3"/>

<g transform="translate(80, 130)">
<!-- Ombre -->
<ellipse cx="220" cy="180" rx="240" ry="14" fill="black" opacity="0.6"/>
<!-- Voiture sport profil bas -->
<path d="M 30 130 Q 50 90 110 80 Q 160 70 200 60 L 290 55 Q 360 65 400 95 Q 420 115 425 140 L 425 165 Q 420 175 410 178 L 30 178 Q 22 174 22 165 Z" fill="url(#sport)"/>
<!-- Ligne aérodynamique -->
<path d="M 50 130 L 410 130" stroke="url(#reflect)" stroke-width="2"/>
<!-- Toit/cockpit -->
<path d="M 130 78 Q 165 55 220 55 L 285 55 Q 340 60 360 90 L 350 110 L 145 110 Z" fill="#050810"/>
<path d="M 145 80 Q 175 65 220 65 L 280 65 Q 330 70 350 90 L 345 105 L 155 105 Z" fill="#15233a" opacity="0.9"/>
<!-- Phares LED -->
<rect x="40" y="125" width="35" height="6" rx="3" fill="#a8c8e8"/>
<rect x="40" y="125" width="35" height="2" rx="1" fill="white"/>
<!-- Phares arrière -->
<rect x="395" y="125" width="20" height="6" rx="2" fill="#c8102e" opacity="0.7"/>
<!-- Roues sport -->
<circle cx="100" cy="170" r="32" fill="#0a0d12"/>
<circle cx="100" cy="170" r="28" fill="#1a1f28"/>
<g transform="translate(100, 170)">
<line x1="-22" y1="0" x2="22" y2="0" stroke="#4d7ab0" stroke-width="2" opacity="0.6"/>
<line x1="0" y1="-22" x2="0" y2="22" stroke="#4d7ab0" stroke-width="2" opacity="0.6"/>
<line x1="-15" y1="-15" x2="15" y2="15" stroke="#4d7ab0" stroke-width="2" opacity="0.6"/>
<line x1="-15" y1="15" x2="15" y2="-15" stroke="#4d7ab0" stroke-width="2" opacity="0.6"/>
<circle r="6" fill="#0a0d12"/>
</g>
<circle cx="350" cy="170" r="32" fill="#0a0d12"/>
<circle cx="350" cy="170" r="28" fill="#1a1f28"/>
<g transform="translate(350, 170)">
<line x1="-22" y1="0" x2="22" y2="0" stroke="#4d7ab0" stroke-width="2" opacity="0.6"/>
<line x1="0" y1="-22" x2="0" y2="22" stroke="#4d7ab0" stroke-width="2" opacity="0.6"/>
<line x1="-15" y1="-15" x2="15" y2="15" stroke="#4d7ab0" stroke-width="2" opacity="0.6"/>
<line x1="-15" y1="15" x2="15" y2="-15" stroke="#4d7ab0" stroke-width="2" opacity="0.6"/>
<circle r="6" fill="#0a0d12"/>
</g>
</g>

<text x="300" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#a87928">VÉHICULE PRESTIGE</text>
</svg>
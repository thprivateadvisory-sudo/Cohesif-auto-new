<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
<defs>
<radialGradient id="bgp" cx="0.5" cy="0.45" r="0.7">
<stop offset="0%" stop-color="#3a5680" stop-opacity="1"/>
<stop offset="40%" stop-color="#1e3a5f" stop-opacity="1"/>
<stop offset="100%" stop-color="#0a1525" stop-opacity="1"/>
</radialGradient>
<radialGradient id="spotlight" cx="0.5" cy="0.55" r="0.45">
<stop offset="0%" stop-color="#a8c8e8" stop-opacity="0.5"/>
<stop offset="50%" stop-color="#6d96cc" stop-opacity="0.15"/>
<stop offset="100%" stop-color="#6d96cc" stop-opacity="0"/>
</radialGradient>
<linearGradient id="sport" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#dde6f2"/>
<stop offset="40%" stop-color="#7a9ec2"/>
<stop offset="100%" stop-color="#1e3a5f"/>
</linearGradient>
<linearGradient id="cockpit" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#3a5680"/>
<stop offset="100%" stop-color="#0f1d2e"/>
</linearGradient>
<linearGradient id="reflect" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#fff" stop-opacity="0"/>
<stop offset="50%" stop-color="#fff" stop-opacity="0.7"/>
<stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
</defs>

<!-- Fond showroom premium -->
<rect width="600" height="400" fill="url(#bgp)"/>

<!-- Spot lumineux derrière la voiture -->
<ellipse cx="300" cy="220" rx="280" ry="120" fill="url(#spotlight)"/>

<!-- Particules d'ambiance -->
<circle cx="80" cy="60" r="1.2" fill="#a8c8e8" opacity="0.7"/>
<circle cx="500" cy="80" r="1" fill="#a8c8e8" opacity="0.5"/>
<circle cx="120" cy="320" r="1" fill="#a8c8e8" opacity="0.4"/>
<circle cx="520" cy="300" r="1.2" fill="#a8c8e8" opacity="0.5"/>
<circle cx="60" cy="220" r="0.8" fill="#a8c8e8" opacity="0.6"/>

<g transform="translate(80, 130)">
<!-- Ombre portée intense -->
<ellipse cx="220" cy="180" rx="240" ry="14" fill="black" opacity="0.55"/>

<!-- Carrosserie sport (gradient clair → bleu, pour ressortir sur fond sombre) -->
<path d="M 30 130 Q 50 90 110 80 Q 160 70 200 60 L 290 55 Q 360 65 400 95 Q 420 115 425 140 L 425 165 Q 420 175 410 178 L 30 178 Q 22 174 22 165 Z" fill="url(#sport)"/>

<!-- Ligne reflet aérodynamique (ressort fortement) -->
<path d="M 50 130 L 410 130" stroke="url(#reflect)" stroke-width="2.5"/>

<!-- Cockpit / vitres -->
<path d="M 130 78 Q 165 55 220 55 L 285 55 Q 340 60 360 90 L 350 110 L 145 110 Z" fill="url(#cockpit)"/>
<path d="M 145 82 Q 175 67 220 67 L 280 67 Q 325 72 345 92 L 340 105 L 155 105 Z" fill="#5a7da8" opacity="0.5"/>

<!-- Reflet sur le toit -->
<path d="M 165 60 Q 200 56 240 56 L 270 56 Q 280 58 285 62" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.6" fill="none"/>

<!-- Phares LED avant -->
<rect x="38" y="123" width="38" height="8" rx="3" fill="#fff"/>
<rect x="40" y="125" width="35" height="3" rx="1" fill="#a8c8e8"/>
<ellipse cx="57" cy="127" rx="22" ry="3" fill="#fff" opacity="0.9"/>

<!-- Phares arrière -->
<rect x="393" y="123" width="24" height="8" rx="2" fill="#ff5f57"/>
<rect x="395" y="125" width="20" height="3" rx="1" fill="#ffb3ad" opacity="0.8"/>

<!-- Roue avant sport -->
<circle cx="100" cy="170" r="32" fill="#0a0d12"/>
<circle cx="100" cy="170" r="28" fill="#1a1f28"/>
<circle cx="100" cy="170" r="22" fill="#0f1419"/>
<g transform="translate(100, 170)">
<line x1="-20" y1="0" x2="20" y2="0" stroke="#a8c8e8" stroke-width="2.2"/>
<line x1="0" y1="-20" x2="0" y2="20" stroke="#a8c8e8" stroke-width="2.2"/>
<line x1="-14" y1="-14" x2="14" y2="14" stroke="#a8c8e8" stroke-width="2.2"/>
<line x1="-14" y1="14" x2="14" y2="-14" stroke="#a8c8e8" stroke-width="2.2"/>
<circle r="6" fill="#0a0d12"/>
<circle r="3" fill="#a8c8e8"/>
</g>

<!-- Roue arrière sport -->
<circle cx="350" cy="170" r="32" fill="#0a0d12"/>
<circle cx="350" cy="170" r="28" fill="#1a1f28"/>
<circle cx="350" cy="170" r="22" fill="#0f1419"/>
<g transform="translate(350, 170)">
<line x1="-20" y1="0" x2="20" y2="0" stroke="#a8c8e8" stroke-width="2.2"/>
<line x1="0" y1="-20" x2="0" y2="20" stroke="#a8c8e8" stroke-width="2.2"/>
<line x1="-14" y1="-14" x2="14" y2="14" stroke="#a8c8e8" stroke-width="2.2"/>
<line x1="-14" y1="14" x2="14" y2="-14" stroke="#a8c8e8" stroke-width="2.2"/>
<circle r="6" fill="#0a0d12"/>
<circle r="3" fill="#a8c8e8"/>
</g>
</g>

<text x="300" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#d4af6a">VÉHICULE PRESTIGE</text>
</svg>

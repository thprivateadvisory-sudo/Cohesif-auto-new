<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#e6e9ec"/>
<stop offset="100%" stop-color="#cdd3da"/>
</linearGradient>
<linearGradient id="utility" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#2a4d7a"/>
<stop offset="100%" stop-color="#15233a"/>
</linearGradient>
</defs>
<rect width="600" height="400" fill="url(#bg2)"/>
<line x1="0" y1="280" x2="600" y2="280" stroke="rgba(15,23,32,0.1)"/>

<g transform="translate(120, 140)">
<!-- Ombre -->
<ellipse cx="180" cy="160" rx="190" ry="12" fill="black" opacity="0.15"/>
<!-- Carrosserie utilitaire -->
<path d="M 30 80 L 30 50 Q 35 30 60 25 L 280 25 Q 305 30 320 50 L 350 50 L 360 90 L 360 145 L 30 145 Z" fill="url(#utility)"/>
<!-- Vitres -->
<rect x="60" y="40" width="220" height="35" rx="3" fill="#0a1422" opacity="0.7"/>
<line x1="170" y1="40" x2="170" y2="75" stroke="rgba(255,255,255,0.1)"/>
<!-- Roues -->
<circle cx="90" cy="145" r="28" fill="#0a0d12"/>
<circle cx="90" cy="145" r="20" fill="#2d3540"/>
<circle cx="290" cy="145" r="28" fill="#0a0d12"/>
<circle cx="290" cy="145" r="20" fill="#2d3540"/>
<!-- Phares -->
<rect x="345" y="95" width="12" height="20" rx="2" fill="#a8c8e8"/>
<!-- Logo / portière -->
<rect x="160" y="100" width="40" height="2" fill="rgba(255,255,255,0.2)"/>
</g>

<text x="300" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#5a6573">VÉHICULE CLASSIQUE</text>
</svg>
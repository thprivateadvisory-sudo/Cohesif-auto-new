<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" preserveAspectRatio="xMidYMid slice">
<defs>
<!-- Fond profond avec dégradés multiples -->
<linearGradient id="bgMain" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#1a2940"/>
<stop offset="40%" stop-color="#15233a"/>
<stop offset="100%" stop-color="#0a1525"/>
</linearGradient>

<!-- Halo principal en haut -->
<radialGradient id="haloTop" cx="0.5" cy="0.15" r="0.5">
<stop offset="0%" stop-color="#4d7ab0" stop-opacity="0.4"/>
<stop offset="40%" stop-color="#2a4d7a" stop-opacity="0.2"/>
<stop offset="100%" stop-color="#2a4d7a" stop-opacity="0"/>
</radialGradient>

<!-- Lueur secondaire en bas -->
<radialGradient id="haloBottom" cx="0.7" cy="0.85" r="0.6">
<stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
</radialGradient>

<!-- Lueur de gauche -->
<radialGradient id="haloLeft" cx="0.15" cy="0.6" r="0.4">
<stop offset="0%" stop-color="#4d7ab0" stop-opacity="0.25"/>
<stop offset="100%" stop-color="#4d7ab0" stop-opacity="0"/>
</radialGradient>

<!-- Pattern grille technique -->
<pattern id="techGrid" width="60" height="60" patternUnits="userSpaceOnUse">
<path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
<circle cx="0" cy="0" r="1" fill="rgba(77,122,176,0.4)"/>
</pattern>

<!-- Pattern grille fine -->
<pattern id="fineGrid" width="20" height="20" patternUnits="userSpaceOnUse">
<path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="0.5"/>
</pattern>

<!-- Gradient pour les lignes -->
<linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#4d7ab0" stop-opacity="0"/>
<stop offset="50%" stop-color="#4d7ab0" stop-opacity="0.7"/>
<stop offset="100%" stop-color="#4d7ab0" stop-opacity="0"/>
</linearGradient>

<linearGradient id="lineVert" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#4d7ab0" stop-opacity="0"/>
<stop offset="50%" stop-color="#4d7ab0" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#4d7ab0" stop-opacity="0"/>
</linearGradient>
</defs>

<!-- Couches de fond -->
<rect width="1200" height="1400" fill="url(#bgMain)"/>
<rect width="1200" height="1400" fill="url(#fineGrid)"/>
<rect width="1200" height="1400" fill="url(#techGrid)"/>
<rect width="1200" height="1400" fill="url(#haloTop)"/>
<rect width="1200" height="1400" fill="url(#haloBottom)"/>
<rect width="1200" height="1400" fill="url(#haloLeft)"/>

<!-- Lignes horizontales lumineuses (effet "highway/circuit") -->
<line x1="0" y1="350" x2="1200" y2="350" stroke="url(#lineGlow)" stroke-width="1" opacity="0.6"/>
<line x1="0" y1="500" x2="1200" y2="500" stroke="url(#lineGlow)" stroke-width="0.5" opacity="0.4"/>
<line x1="0" y1="700" x2="1200" y2="700" stroke="url(#lineGlow)" stroke-width="1.5" opacity="0.7"/>
<line x1="0" y1="900" x2="1200" y2="900" stroke="url(#lineGlow)" stroke-width="0.5" opacity="0.4"/>
<line x1="0" y1="1100" x2="1200" y2="1100" stroke="url(#lineGlow)" stroke-width="1" opacity="0.5"/>

<!-- Lignes verticales -->
<line x1="200" y1="0" x2="200" y2="1400" stroke="url(#lineVert)" stroke-width="0.5" opacity="0.3"/>
<line x1="600" y1="0" x2="600" y2="1400" stroke="url(#lineVert)" stroke-width="1" opacity="0.4"/>
<line x1="1000" y1="0" x2="1000" y2="1400" stroke="url(#lineVert)" stroke-width="0.5" opacity="0.3"/>

<!-- Cercles concentriques (radar/réseau) -->
<g opacity="0.4" stroke="rgba(77,122,176,0.5)" fill="none">
<circle cx="600" cy="700" r="200" stroke-width="0.5"/>
<circle cx="600" cy="700" r="350" stroke-width="0.3"/>
<circle cx="600" cy="700" r="500" stroke-width="0.5"/>
<circle cx="600" cy="700" r="650" stroke-width="0.3"/>
</g>

<!-- Point central lumineux -->
<circle cx="600" cy="700" r="6" fill="#4d7ab0"/>
<circle cx="600" cy="700" r="14" fill="#4d7ab0" opacity="0.4"/>
<circle cx="600" cy="700" r="28" fill="#4d7ab0" opacity="0.15"/>

<!-- Étoiles/points lumineux dispersés -->
<g fill="#a8c8e8">
<circle cx="120" cy="180" r="1.5" opacity="0.8"/>
<circle cx="280" cy="120" r="1" opacity="0.5"/>
<circle cx="450" cy="240" r="1.2" opacity="0.6"/>
<circle cx="780" cy="160" r="1" opacity="0.4"/>
<circle cx="950" cy="280" r="1.5" opacity="0.7"/>
<circle cx="1080" cy="120" r="1" opacity="0.5"/>
<circle cx="180" cy="450" r="1" opacity="0.4"/>
<circle cx="380" cy="580" r="1.2" opacity="0.5"/>
<circle cx="850" cy="520" r="1" opacity="0.4"/>
<circle cx="1100" cy="650" r="1.3" opacity="0.6"/>
<circle cx="220" cy="850" r="1" opacity="0.4"/>
<circle cx="450" cy="950" r="1.2" opacity="0.5"/>
<circle cx="780" cy="880" r="1" opacity="0.4"/>
<circle cx="980" cy="1050" r="1.3" opacity="0.6"/>
<circle cx="320" cy="1150" r="1" opacity="0.4"/>
<circle cx="650" cy="1200" r="1.2" opacity="0.5"/>
<circle cx="950" cy="1280" r="1" opacity="0.4"/>
</g>

<!-- Forme géométrique abstraite (hexagone subtil) en bas -->
<g opacity="0.15" stroke="#4d7ab0" fill="none" stroke-width="1">
<polygon points="600,1100 750,1180 750,1340 600,1420 450,1340 450,1180" />
</g>

<!-- Reflet/scan lumineux -->
<rect x="0" y="680" width="1200" height="40" fill="url(#lineGlow)" opacity="0.3"/>

<!-- Étiquette discrète en haut -->
<g opacity="0.5">
<line x1="80" y1="100" x2="120" y2="100" stroke="#4d7ab0" stroke-width="1"/>
<text x="130" y="105" font-family="monospace" font-size="11" font-weight="700" fill="#a8c8e8" letter-spacing="3">COHESIF.AUTO / SYSTEM ACTIVE</text>
</g>

<!-- Code en bas -->
<g opacity="0.4">
<text x="80" y="1340" font-family="monospace" font-size="10" fill="#a8c8e8" letter-spacing="2">[ MOBILITÉ · TRANSPORT · LOGISTIQUE ]</text>
</g>

</svg>
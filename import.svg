<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bgi" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#1a2940"/>
<stop offset="100%" stop-color="#0a1525"/>
</linearGradient>
<linearGradient id="container1" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#1e3a5f"/>
<stop offset="100%" stop-color="#0d1d2f"/>
</linearGradient>
<linearGradient id="container2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#2a4d7a"/>
<stop offset="100%" stop-color="#15233a"/>
</linearGradient>
<pattern id="containerLines" width="20" height="100" patternUnits="userSpaceOnUse">
<line x1="0" y1="0" x2="0" y2="100" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
</pattern>
</defs>
<rect width="800" height="450" fill="url(#bgi)"/>

<!-- Ciel étoilé -->
<circle cx="100" cy="50" r="1" fill="white" opacity="0.4"/>
<circle cx="250" cy="80" r="1" fill="white" opacity="0.3"/>
<circle cx="500" cy="40" r="1" fill="white" opacity="0.5"/>
<circle cx="700" cy="90" r="1" fill="white" opacity="0.3"/>

<!-- Sol -->
<line x1="0" y1="380" x2="800" y2="380" stroke="rgba(77,122,176,0.2)"/>

<!-- Containers empilés (style port) -->
<!-- Rangée du fond -->
<g opacity="0.6">
<rect x="80" y="200" width="180" height="80" fill="url(#container1)"/>
<rect x="80" y="200" width="180" height="80" fill="url(#containerLines)"/>
<rect x="280" y="200" width="180" height="80" fill="url(#container2)"/>
<rect x="280" y="200" width="180" height="80" fill="url(#containerLines)"/>
<rect x="480" y="200" width="180" height="80" fill="url(#container1)"/>
<rect x="480" y="200" width="180" height="80" fill="url(#containerLines)"/>
</g>

<!-- Rangée principale au premier plan -->
<g>
<rect x="50" y="280" width="220" height="100" fill="url(#container2)"/>
<rect x="50" y="280" width="220" height="100" fill="url(#containerLines)"/>
<rect x="50" y="280" width="220" height="6" fill="rgba(0,0,0,0.4)"/>
<rect x="50" y="372" width="220" height="6" fill="rgba(0,0,0,0.4)"/>
<text x="160" y="335" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="rgba(255,255,255,0.3)" letter-spacing="2">EU-DE</text>

<rect x="290" y="280" width="220" height="100" fill="url(#container1)"/>
<rect x="290" y="280" width="220" height="100" fill="url(#containerLines)"/>
<rect x="290" y="280" width="220" height="6" fill="rgba(0,0,0,0.4)"/>
<rect x="290" y="372" width="220" height="6" fill="rgba(0,0,0,0.4)"/>
<text x="400" y="335" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="rgba(255,255,255,0.3)" letter-spacing="2">US-CA</text>

<rect x="530" y="280" width="220" height="100" fill="url(#container2)"/>
<rect x="530" y="280" width="220" height="100" fill="url(#containerLines)"/>
<rect x="530" y="280" width="220" height="6" fill="rgba(0,0,0,0.4)"/>
<rect x="530" y="372" width="220" height="6" fill="rgba(0,0,0,0.4)"/>
<text x="640" y="335" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="rgba(255,255,255,0.3)" letter-spacing="2">JP-TY</text>
</g>

<!-- Grue (silhouette) -->
<g opacity="0.4">
<line x1="700" y1="50" x2="700" y2="200" stroke="#4d7ab0" stroke-width="3"/>
<line x1="700" y1="80" x2="780" y2="80" stroke="#4d7ab0" stroke-width="2"/>
<line x1="780" y1="80" x2="780" y2="160" stroke="#4d7ab0" stroke-width="1"/>
</g>

<text x="400" y="60" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="rgba(168,200,232,0.6)">SOURCING INTERNATIONAL</text>
</svg>